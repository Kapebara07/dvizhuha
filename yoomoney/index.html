<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Сюда ЮMoney возвращает админа после «Разрешить» (redirect URI приложения). Страница передаёт одноразовый код
       скрипту «получить-токен» на этом же компьютере (127.0.0.1) и больше ничего с ним не делает. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Движуха — подключение ЮMoney</title>
  <link rel="icon" href="../img/favicon.png">
  <link rel="stylesheet" href="yoo.css">
</head>
<body>
  <main>
    <h1>Подключение ЮMoney</h1>
    <p id="msg">Передаю код в окно скрипта…</p>
    <p id="manual" hidden>Если окно скрипта ничего не получило — нажми в нём Enter и вставь этот код (он действует меньше минуты):
      <code id="code"></code></p>
  </main>
  <script src="go.js"></script>
</body>
</html>
